spring.application.name=circle-recommendations

# Default database: the Postgres from compose.yaml, reached from your machine on port 5433.
# Inside Docker Compose these are overridden by the SPRING_DATASOURCE_* environment variables.
# In tests, Testcontainers (@ServiceConnection) overrides them automatically.
spring.datasource.url=jdbc:postgresql://localhost:5433/circles
spring.datasource.username=circles
spring.datasource.password=circles

# A JSON API renders no views, so don't keep the database session open while writing the response.
spring.jpa.open-in-view=false
